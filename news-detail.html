<!DOCTYPE HTML>
<html>
<head>
    <title>News Detail | Tumu Siime</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    
    <meta name="description" id="meta-desc" content="Read the latest news from Tumu Siime.">
    <meta property="og:type" content="article">
    <meta property="og:title" id="og-title" content="News Detail | Tumu Siime">
    <meta property="og:description" id="og-desc" content="Media Executive, Creative, and Consultant.">
    <meta property="og:image" id="og-image" content="https://tumusiime.com/images/Tumu_Siime_OG.jpg">
    <meta property="og:url" id="og-url" content="">
    <meta name="twitter:card" content="summary_large_image">

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@3.4.1/dist/css/bootstrap.min.css" />
    <link rel="stylesheet" href="css/style.css" />
    
    <style>
        #main-article { max-width: 800px; margin: 0 auto; padding: 30px 20px; font-family: "Source Sans Pro", sans-serif; }
        .back-btn { display: inline-block; margin-bottom: 25px; color: #10b981; font-weight: bold; text-decoration: none; }
        .featured-img { width: 100%; border-radius: 8px; margin-bottom: 20px; height: auto; display: block; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        h1#render-title { margin-bottom: 15px; font-weight: 800; color: #1e3a8a; line-height: 1.2; }
        #render-body { line-height: 1.6; color: #333; font-size: 1.15em; }
        #render-body p { margin-bottom: 12px !important; }
        #render-body h3 { margin-top: 25px !important; margin-bottom: 10px !important; font-weight: 700; color: #1e3a8a; border-bottom: 2px solid #10b981; display: inline-block; padding-bottom: 2px; }
        #render-body blockquote { margin: 20px 0 !important; padding: 15px 25px; border-left: 5px solid #10b981; background: #f9f9f9; font-style: italic; }
        .table { margin-bottom: 20px !important; }
        .share-container { margin-top: 40px; padding-top: 20px; border-top: 1px solid #eee; text-align: center; }
        .whatsapp-btn { background: #25D366; color: white !important; padding: 10px 20px; border-radius: 5px; font-weight: bold; text-decoration: none; display: inline-block; }
    </style>
</head>
<body>

    <div id="main-article">
        <a href="index.html#news" class="back-btn">&larr; Back to News Feed</a>
        <h1 id="render-title">Loading Article...</h1>
        <div id="render-image-container"></div>
        <div id="render-body"></div>

        <div class="share-container">
            <p>Share this article:</p>
            <a href="#" id="whatsapp-share" class="whatsapp-btn" target="_blank">Share on WhatsApp</a>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-app.js";
        import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAcA7nenT5Owf9PRK_wyXhO_Lf-kJzR6PE",
            authDomain: "realtumusiime.firebaseapp.com",
            projectId: "realtumusiime",
            storageBucket: "realtumusiime.firebasestorage.app",
            messagingSenderId: "20793631740",
            appId: "1:20793631740:web:817fa9864ca9e8bae50879"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        const urlParams = new URLSearchParams(window.location.search);
        const articleId = urlParams.get('id');

        if (articleId) {
            const docRef = doc(db, "news", articleId);
            getDoc(docRef).then((docSnap) => {
                if (docSnap.exists()) {
                    const data = docSnap.data();

                    // 1. Update On-Page Content
                    document.getElementById('render-title').innerText = data.Title;
                    if (data.imageUrl) {
                        document.getElementById('render-image-container').innerHTML = `<img src="${data.imageUrl}" class="featured-img">`;
                    }
                    document.getElementById('render-body').innerHTML = data.body;

                    // 2. Dynamic SEO & Open Graph Update
                    document.title = `${data.Title} | Tumu Siime`;
                    const tempDiv = document.createElement("div");
                    tempDiv.innerHTML = data.body || "";
                    const plainText = (tempDiv.textContent || tempDiv.innerText || "").substring(0, 160) + "...";

                    document.getElementById('meta-desc').setAttribute("content", plainText);
                    document.getElementById('og-title').setAttribute("content", data.Title);
                    document.getElementById('og-desc').setAttribute("content", plainText);
                    document.getElementById('og-url').setAttribute("content", window.location.href);
                    if (data.imageUrl) document.getElementById('og-image').setAttribute("content", data.imageUrl);

                    // 3. Update WhatsApp Share Link
                    const shareText = encodeURIComponent(`Check out this article by Tumu Siime: ${data.Title} - `);
                    document.getElementById('whatsapp-share').href = `https://api.whatsapp.com/send?text=${shareText}${window.location.href}`;

                }
            });
        }
    </script>
</body>
</html>
